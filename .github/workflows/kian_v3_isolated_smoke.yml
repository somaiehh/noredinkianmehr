name: Kian V3 Isolated Smoke Test

on:
  push:
    branches:
      - kian-v3-monitor-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-smoke:
    if: github.ref == 'refs/heads/kian-v3-monitor-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V3 test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare isolated V3 lab directory
        run: mkdir -p "$HOME/kian_v3_upgrade_lab"
      - name: Run V3 synthetic run_once integration
        shell: bash
        run: |
          set -euo pipefail
          docker build -t kian-v3-final-test -f - . <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /app
          COPY requirements.txt /tmp/requirements.txt
          RUN pip install --no-cache-dir -r /tmp/requirements.txt
          DOCKERFILE

          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=256m,mode=1777 \
            --mount "type=bind,src=$PWD,dst=/app,readonly" \
            --workdir /app \
            --env GITHUB_ACTIONS=true \
            --env HOME=/tmp/home \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GITHUB_TOKEN= \
            --env GH_TOKEN= \
            --env NTFY_TOPIC= \
            --env NTFY_URL= \
            kian-v3-final-test \
            sh -c 'mkdir -p "$HOME" && exec python -B kian_v3_runonce_integration_test.py'

      - name: Run isolated V3 smoke test
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          NTFY_TOPIC: ""
          NTFY_URL: ""
        run: python -B kian_v3_github_smoke.py
