name: Tabdeal Radar Scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: tabdeal-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tabdeal radar
        run: |
          python -u radar_live.py --once

      - name: Save new radar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tabdeal_radar_v21_data.json persistence_state.json

          if git diff --cached --quiet; then
            echo "No radar changes to save."
          else
            git commit -m "Auto update radar data"
            git push
          fi
